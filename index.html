        // SHA-256 password hashing
        async function hashPassword(plainText, salt = 'sanyu_salt_2026_uganda') {
            const enc = new TextEncoder();
            const data = enc.encode(plainText + salt);
            const hashBuf = await crypto.subtle.digest('SHA-256', data);
            const hashArr = Array.from(new Uint8Array(hashBuf));
            return hashArr.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 50);
        }

        function generateSecureToken() {
            const arr = new Uint8Array(32);
            crypto.getRandomValues(arr);
            return Array.from(arr).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function generateUniqueId() {
            return 'rec_' + Date.now().toString(36) + Math.random().toString(36).substring(2, 8);
        }

        function generateReferralCode(existingProfiles = []) {
            const used = new Set((existingProfiles || []).map(p => String(p.referralcode || p.referralCode || '').trim()));
            // Eight numeric digits; check existing profiles before assigning to avoid collisions.
            for (let attempt = 0; attempt < 1000; attempt++) {
                const code = String(Math.floor(10000000 + Math.random() * 90000000));
                if (!used.has(code)) return code;
            }
            throw new Error('Could not generate a unique referral number. Please try again.');
        }

            const now = new Date();

        }

            if (r < 0.85) return tiers[1].amount;
            if (r < 0.97) return tiers[2].amount;

        }

        // Diagnostic recorder

        function logDiagnosticError(category, action, step, message, status = 0, path = '', technical = '') {
            const report = {
                id: Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                timestamp: new Date().toISOString(),
                category,
                action,
                failedStep: step,
                errorMessage: message || 'Unknown error occurred',
                httpStatus: status || 0,
                requestPath: path || 'Appwrite REST',
                details: technical ? String(technical).substring(0, 300) : ''
            };
            globalErrorReports.unshift(report);
            if (globalErrorReports.length > 50) globalErrorReports.pop();
            console.warn('[SANYU DIAGNOSTIC]', report);
            return report;
        }

        // Appwrite REST caller
        async function callAppwrite(path, method = 'GET', body = null) {
            const url = `${APPWRITE_CONFIG.ENDPOINT}${path}`;
            const headers = {
                'X-Appwrite-Project': APPWRITE_CONFIG.PROJECT_ID,
                'Content-Type': 'application/json'
            };

            const sessionToken = localStorage.getItem('sanyu_session_token');
            if (sessionToken) {
                headers['X-Appwrite-JWT'] = sessionToken;
            }

            const options = {
                method,
                headers
            };
            if (body && method !== 'GET') {
                options.body = JSON.stringify(body);
            }

            try {
                const res = await fetch(url, options);
                const data = await res.json().catch(() => ({}));
                return { ok: res.ok, status: res.status, data };
            } catch (err) {
                return { ok: false, status: 0, error: err.message, data: { message: err.message } };
            }
        }

                const pwdHash = await hashPassword(password);

                try {
                    const res = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents`);
                    let profile = null;

                    if (res.ok && res.data && res.data.documents) {
                        profile = res.data.documents.find(d => d.phone === fullPhone);
                    } else {
                        logDiagnosticError('login', 'queryProfiles', 'fetchDocuments', res.data?.message || 'Access check', res.status, '/documents');
                        const localProfiles = JSON.parse(localStorage.getItem('sanyu_all_profiles') || '[]');
                        profile = localProfiles.find(d => d.phone === fullPhone);
                    }

                    if (!profile) {
                        setAuthError('Account not found. Please check your phone number or register a new account.');
                        setAuthLoading(false);
                        return;
                    }

                    if (profile.isblocked || profile.status === 'blocked') {
                        setAuthError('This account has been temporarily suspended. Please contact support for assistance.');
                        setAuthLoading(false);
                        return;
                    }

                    if (profile.password !== pwdHash) {
                        setAuthError('The password you entered is incorrect. Please try again.');
                        setAuthLoading(false);
                        return;
                    }

                    // Create Session
                    const sessionDoc = {
                        userId: profile.$id || profile.phone,
                        tokenhash: generateSecureToken(),
                        expiresat: new Date(Date.now() + 30 * 24 * 3600 * 1000).toISOString(),
                        lastusedat: new Date().toISOString(),
                        revokedat: null,
                        deviceinfo: navigator.userAgent.substring(0, 250)
                    };

                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.SESSIONS}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: sessionDoc
                    }).catch(() => {});

                    localStorage.setItem('sanyu_session', JSON.stringify(sessionDoc));
                    localStorage.setItem('sanyu_profile', JSON.stringify(profile));
                    setCurrentUser(profile);
                    setCurrentSession(sessionDoc);

                    setAuthLoading(false);
                    setScreen('home');
                    loadUserData(profile);
                    showToast("Kilikitya, welcome back to Sanyu Season! 🇺🇬🎄");
                } catch (err) {
                    setAuthError('Login network error: ' + err.message);
                    setAuthLoading(false);
                    logDiagnosticError('login', 'loginException', 'execute', err.message);
                }
            };

            // ==================== AUTHENTICATION: REGISTER ====================
            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthLoading(true);

                if (username.trim().length < 3) {
                    setAuthError('Please enter a username with at least 3 characters.');
                    setAuthLoading(false);
                    return;
                }
                if (phone.length !== 9) {
                    setAuthError('Please enter a valid 9-digit Ugandan phone number (e.g., +256-701234567).');
                    setAuthLoading(false);
                    return;
                }
                if (password.length < 8) {
                    setAuthError('Password must be at least 8 characters.');
                    setAuthLoading(false);
                    return;
                }

                const fullPhone = '+256' + phone;
                const pwdHash = await hashPassword(password);

                try {
                    // Check duplicate phone
                    const existRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents?limit=5000`);
                    if (existRes.ok && existRes.data && existRes.data.documents) {
                        const existing = existRes.data.documents.find(d => d.phone === fullPhone);
                        if (existing) {
                            setAuthError('An account with this phone number already exists. Please login instead.');
                            setAuthLoading(false);
                            return;
                        }
                    }

                    // Validate referral code if provided
                    // Resolve the referral code to the actual referrer's profile document ID.
                    // Store that ID so purchase commissions can credit the correct account.
                    let referrerProfileId = 'Direct';
                    let referrerReferralCode = '';
                    let referrerUsername = '';
                    const enteredReferralCode = String(refCodeInput || '').replace(/\s+/g, '').trim();
                    if (enteredReferralCode) {
                        if (existRes.ok && existRes.data && Array.isArray(existRes.data.documents)) {
                            const refDoc = existRes.data.documents.find(d =>
                                String(d.referralcode || d.referralCode || '').trim() === enteredReferralCode
                            );
                            if (refDoc && refDoc.$id) {
                                referrerProfileId = refDoc.$id;
                                referrerReferralCode = String(refDoc.referralcode || refDoc.referralCode || enteredReferralCode);
                                referrerUsername = String(refDoc.username || '');
                            } else {
                                setAuthError('That numeric referral code was not found. Check the digits or leave it blank.');
                                setAuthLoading(false);
                                return;
                            }
                        } else {
                            setAuthError('Could not verify the referral number right now. Please try again.');
                            setAuthLoading(false);
                            return;
                        }
                    }

                    const myRefCode = generateReferralCode(existRes.data?.documents || []);
                    const docId = generateUniqueId();

                    // Initial registration bonus: UGX 3,000 credited to availablebalance
                    // walletbalance initializes at 0 (only credited by approved deposits)
                    const profileDoc = {
                        $id: docId,
                        username: username.trim(),
                        phone: fullPhone,
                        password: pwdHash,
                        referralcode: myRefCode,
                        role: 'customer',
                        status: 'active',
                        phoneverified: true,
                        walletbalance: 0,
                        availablebalance: 3000,
                        totalwithdraws: 0,
                        // The profiles schema supports `referredby`; store the actual referrer's profile ID here.
                        referredby: referrerProfileId,
                        totaldailyrewards: 0,
                        totalgiftrewards: 3000,
                        totalcommissions: 0,
                        lastseenat: new Date().toISOString(),
                        isblocked: false
                    };

                    const createRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents`, 'POST', {
                        documentId: docId,
                        data: profileDoc
                    });

                    if (!createRes.ok || !createRes.data?.$id) {
                        const profileError = createRes.data?.message || 'Appwrite did not confirm that the profile was saved.';
                        logDiagnosticError('register', 'createProfile', 'profilesTable', profileError, createRes.status, '/profiles');
                        setAuthError('Registration could not be completed because your account profile was not saved. Please try again.');
                        setAuthLoading(false);
                        return;
                    }

                    // Notify the referrer once the referred person's profile is confirmed in Appwrite.
                    // Deterministic ID prevents duplicate referral-signup notifications on retries.
                    if (referrerProfileId !== 'Direct') {
                        const referralNotice = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.NOTIFICATIONS}/documents`, 'POST', {
                            documentId: `ref_signup_${docId}`,
                            data: {
                                userId: referrerProfileId,
                                title: 'New Referral Joined',
                                message: `${username.trim()} joined Sanyu Season using your referral link.`,
                                type: 'referral',
                                isread: false,
                                referenceId: docId,
                                readAt: null
                            }
                        });
                        if (!referralNotice.ok && referralNotice.status !== 409) {
                            logDiagnosticError('referral', 'notifyReferrerSignup', 'notifications', referralNotice.data?.message || 'Referral signup notification could not be saved.', referralNotice.status, '/notifications');
                        }
                    }

                    // Save local backup
                    const allProfiles = JSON.parse(localStorage.getItem('sanyu_all_profiles') || '[]');
                    allProfiles.push(profileDoc);
                    localStorage.setItem('sanyu_all_profiles', JSON.stringify(allProfiles));

                    // Ledger bonus record
                    const ledgerDoc = {
                        userId: profileDoc.$id,
                        transactiontype: 'registration_bonus',
                        amount: 3000,
                        balancebefore: 0,
                        balanceafter: 3000,
                        refId: 'reg_' + Date.now(),
                        status: 'completed'
                    };
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: ledgerDoc
                    }).catch(() => {});

                    // Notification
                    const notifDoc = {
                        userId: profileDoc.$id,
                        title: 'Welcome Registration Bonus',
                        message: 'Kilikitya! UGX 3,000 registration bonus credited to your Earnings Balance.',
                        type: 'bonus',
                        isread: false,
                        referenceId: ledgerDoc.refId,
                        readAt: null
                    };
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.NOTIFICATIONS}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: notifDoc
                    }).catch(() => {});

                    // Add welcome Cranes jersey gift
                    const initialGift = {
                        id: 101,
                        title: 'Welcome Festive Gift',
                        giftName: 'Uganda Cranes Classic Red-Gold Jersey',
                        cash: 3000,
                        collected: true,
                        new: false,
                        jerseyImage: JERSEY_IMAGES.santa_starter
                    };
                    localStorage.setItem(`sanyu_gifts_${fullPhone}`, JSON.stringify([initialGift]));

                    // Create session
                    const sessionDoc = {
                        userId: profileDoc.$id,
                        tokenhash: generateSecureToken(),
                        expiresat: new Date(Date.now() + 30 * 24 * 3600 * 1000).toISOString(),
                        lastusedat: new Date().toISOString(),
                        revokedat: null,
                        deviceinfo: navigator.userAgent.substring(0, 250)
                    };
                    localStorage.setItem('sanyu_session', JSON.stringify(sessionDoc));
                    localStorage.setItem('sanyu_profile', JSON.stringify(profileDoc));

                    setCurrentUser(profileDoc);
                    setCurrentSession(sessionDoc);
                    setAvailablebalance(3000);
                    setWalletbalance(0);
                    setAuthLoading(false);
                    setScreen('home');
                    loadUserData(profileDoc);
                    showToast("Kilikitya, welcome to Sanyu Season! UGX 3,000 Registration Bonus credited! 🇺🇬🎁");
                } catch (err) {
                    setAuthError('Registration error: ' + err.message);
                    setAuthLoading(false);
                    logDiagnosticError('register', 'registerException', 'execute', err.message);
                }
            };

            // ==================== LOGOUT ====================
            const handleLogout = async () => {
                if (currentSession && currentUser) {
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.SESSIONS}/documents/${currentSession.$id || ''}`, 'PATCH', {
                        data: { revokedat: new Date().toISOString() }
                    }).catch(() => {});
                }
                localStorage.removeItem('sanyu_session');
                localStorage.removeItem('sanyu_profile');
                setCurrentUser(null);
                setCurrentSession(null);
                setScreen('auth');
                setPassword('');
                showToast("Logged out successfully. Sanyu ne Dembe!");
            };

            // ==================== PURCHASE PACKAGE ====================
            // Strictly uses walletbalance. NEVER deducts from availablebalance!
            const confirmPurchase = async (pkg) => {
                if (!currentUser) return;
                const isAlreadyActive = activePackages.some(p => p.packagekey === pkg.key || p.id === pkg.id);
                if (isAlreadyActive) {
                    showToast("❌ You already have this active package! Complete it first.");
                    return;
                }
                if (walletbalance < pkg.price) {
                    showToast("❌ Insufficient Wallet Balance! Please deposit funds to purchase packages.");
                    setScreen('wallet');
                    return;
                }

                try {
                    // Create the package row first. Appwrite requires lastclaimdate to be a
                    // non-null string; yesterday allows the first claim on the purchase day.
                    const purchaseRef = 'pkg_' + Date.now();
                    const purchaseStartDate = new Date();
                    const purchaseCompletionDate = new Date(purchaseStartDate.getTime() + 25 * 86400000);
                    const lastClaimDateInitial = new Date(new Date(getKampalaDateString() + 'T00:00:00+03:00').getTime() - 86400000).toISOString();
                    const newPkgDoc = {
                        userId: currentUser.$id || currentUser.phone,
                        packagekey: pkg.key || pkg.type,
                        packagename: pkg.name,
                        purchaseprice: pkg.price,
                        dailyreturn: pkg.daily,
                        durationdays: 25,
                        totalreturns: 0,
                        daysclaimed: 0,
                        nextclaimday: 1,
                        startdate: purchaseStartDate.toISOString(),
                        lastclaimdate: lastClaimDateInitial,
                        completiondate: purchaseCompletionDate.toISOString(),
                        status: 'active',
                        purchaseref: purchaseRef
                    };

                    const pkgRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.USERPACKAGES}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: newPkgDoc
                    });

                    if (!pkgRes.ok || !pkgRes.data?.$id) {
                        const message = pkgRes.data?.message || 'Appwrite could not create the package record';
                        logDiagnosticError('purchase', 'createPackage', 'userpackages', message, pkgRes.status, '/userpackages');
                        throw new Error('Package could not be created: ' + message);
                    }

                    // Only deduct the wallet after Appwrite confirms the package row exists.
                    const newWalletBal = walletbalance - pkg.price;
                    const walletRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${currentUser.$id || ''}`, 'PATCH', {
                        data: { walletbalance: newWalletBal }
                    });

                    if (!walletRes.ok) {
                        await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.USERPACKAGES}/documents/${pkgRes.data.$id}`, 'DELETE').catch(() => {});
                        const message = walletRes.data?.message || 'Wallet balance update failed';
                        logDiagnosticError('purchase', 'updateWallet', 'profiles', message, walletRes.status, '/profiles');
                        throw new Error('Wallet was not charged. ' + message);
                    }

                    setWalletbalance(newWalletBal);

                    const activeRecord = {
                        ...pkg,
                        ...newPkgDoc,
                        $id: pkgRes.data.$id,
                        purchaseDate: getKampalaDateString()
                    };

                    const updatedActive = [activeRecord, ...activePackages].sort((a, b) => String(b.$createdAt || b.purchaseDate || b.purchasedat || '').localeCompare(String(a.$createdAt || a.purchaseDate || a.purchasedat || '')));
                    setActivePackages(updatedActive);

                    // Ledger purchase record
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: {
                            userId: currentUser.$id || currentUser.phone,
                            transactiontype: 'package_purchase',
                            amount: pkg.price,
                            balancebefore: walletbalance,
                            balanceafter: newWalletBal,
                            refId: purchaseRef,
                            status: 'completed'
                        }
                    }).catch(() => {});

                    // Generate Purchase Gift with authentic Uganda Cranes Jersey & Cash
                    const giftAmount = rollPurchaseGift(pkg.key || pkg.type);
                    const giftDoc = {
                        userId: currentUser.$id || currentUser.phone,
                        userpackageId: activeRecord.$id,
                        packagekey: pkg.key || pkg.type,
                        giftname: pkg.giftName,
                        rewardamount: giftAmount,
                        status: 'unlocked',
                        unlockedat: new Date().toISOString(),
                        openedat: null,
                        collectedat: null,
                        transactionId: 'gift_' + Date.now()
                    };

                    const giftRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.GIFTS}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: giftDoc
                    }).catch(error => ({ ok: false, data: { message: error.message } }));
                    if (!giftRes.ok || !giftRes.data?.$id) {
                        logDiagnosticError('gifts', 'createPurchaseGift', 'createDocument', giftRes.data?.message || 'Appwrite did not return a saved gift document ID. The gift was not added to the screen.', giftRes.status, '/gifts');
                        showToast('Your purchase succeeded, but the gift could not be saved. Please contact support before trying to collect it.');
                    } else {
                        // Only display a gift after Appwrite confirms it has been persisted.
                        const newGiftStateItem = {
                            id: giftRes.data.$id,
                            title: `${pkg.name} Jersey Gift`,
                            giftName: pkg.giftName,
                            cash: giftAmount,
                            collected: false,
                            new: true,
                            unlockedat: giftDoc.unlockedat,
                            jerseyImage: pkg.jerseyImage || JERSEY_IMAGES.default
                        };
                        setGifts(prev => [newGiftStateItem, ...prev.filter(g => String(g.id) !== String(newGiftStateItem.id))]);
                    }

                    // One commission per referred customer, on their first successful purchase only.
                    // A record is displayed as received only after the referrer's balance is updated.
                    if (currentUser.referredby && currentUser.referredby !== 'Direct') {
                        try {
                            const referredUserId = String(currentUser.$id || currentUser.phone || '');
                            const allCommissions = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.COMMISSIONS}/documents?limit=5000`);
                            const hasPriorCommission = allCommissions.ok && allCommissions.data?.documents?.some(c => String(c.referreduserId || '') === referredUserId);
                            if (!hasPriorCommission) {
                                let referrerProfileId = currentUser.referredby;
                                let referrerProfile = null;
                                const lookup = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${encodeURIComponent(referrerProfileId)}`);
                                if (lookup.ok && lookup.data?.$id) referrerProfile = lookup.data;
                                else {
                                    const profiles = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents?limit=5000`);
                                    if (profiles.ok && profiles.data?.documents) {
                                        referrerProfile = profiles.data.documents.find(d => d.username === currentUser.referredby || d.phone === currentUser.referredby) || null;
                                        if (referrerProfile) referrerProfileId = referrerProfile.$id;
                                    }
                                }
                                if (referrerProfile?.$id) {
                                    const commissionAmount = Math.round(pkg.price * 0.20);
                                    const commissionRef = `ref_first_${referredUserId.replace(/[^A-Za-z0-9._-]/g, '_').slice(-26)}`;
                                    const created = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.COMMISSIONS}/documents`, 'POST', {
                                        documentId: commissionRef,
                                        data: { referreruserId: referrerProfileId, referreduserId: referredUserId, purchaseId: activeRecord.$id, purchaseamount: pkg.price, commissionrateBps: 2000, commissionamount: commissionAmount, status: 'pending', creditedat: null }
                                    });
                                    if (created.ok) {
                                        const newBalance = Number(referrerProfile.availablebalance || 0) + commissionAmount;
                                        const balanceRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${referrerProfile.$id}`, 'PATCH', {
                                            data: { availablebalance: newBalance, totalcommissions: Number(referrerProfile.totalcommissions || 0) + commissionAmount }
                                        });
                                        if (balanceRes.ok) {
                                            const creditedAt = new Date().toISOString();
                                            const finalized = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.COMMISSIONS}/documents/${commissionRef}`, 'PATCH', { data: { status: 'credited', creditedat: creditedAt } });
                                            if (finalized.ok) setReferralCommissions(prev => [{ $id: commissionRef, referreduserId: referredUserId, referredName: currentUser.username || currentUser.phone, purchaseId: activeRecord.$id, purchaseamount: pkg.price, commissionrateBps: 2000, commissionamount: commissionAmount, status: 'credited', creditedat: creditedAt }, ...prev]);
                                            else logDiagnosticError('referral', 'finalizeCommission', 'commissions', finalized.data?.message || 'Balance updated but commission record status could not be finalized.', finalized.status, '/commissions');
                                        } else logDiagnosticError('referral', 'creditCommission', 'profiles', balanceRes.data?.message || 'Commission record exists but referrer balance could not be updated.', balanceRes.status, '/profiles');
                                    } else if (created.status !== 409) logDiagnosticError('referral', 'createCommission', 'commissions', created.data?.message || 'Referral commission could not be recorded.', created.status, '/commissions');
                                } else logDiagnosticError('referral', 'resolveReferrer', 'profiles', 'The saved referral could not be matched to a referrer profile.');
                            }
                        } catch (referralError) {
                            logDiagnosticError('referral', 'firstPurchaseCommission', 'execute', referralError.message);
                        }
                    }

                    // Notification
                    const timeNow = new Date().toISOString().replace('T', ' ').substring(0, 16);
                    setNotifications(prev => [
                        { id: Date.now(), title: "Package Ready & Cranes Jersey Unlocked!", body: `Your ${pkg.name} is active! Enjoy 25 days of rewards and unbox your official Uganda Cranes Jersey.`, time: timeNow, read: false, referenceId: purchaseRef, pendingLocal: true, createdMs: Date.now() },
                        ...prev
                    ]);
                    persistUserNotification("Package Ready & Cranes Jersey Unlocked!", `Your ${pkg.name} is active! Your Uganda Cranes gift is ready to unbox.`, 'purchase', purchaseRef);

                    showToast(`🎉 Activated ${pkg.name}! Check your Gifts to unbox your Cranes Jersey!`);
                    setScreen('home');
                } catch (err) {
                    showToast('Purchase failed: ' + err.message);
                    logDiagnosticError('purchase', 'purchaseException', 'execute', err.message);
                }
            };

            // ==================== DAILY REWARDS CLAIM (DUPLICATE-PROOF) ====================
            // Strictly ONE claim per user, per package, per Kampala calendar day (UTC+3)
            // Credits availablebalance. NEVER touches walletbalance.
            const handleClaimDaily = async (pkgId) => {
                if (!currentUser) return;
                const todayKampala = getKampalaDateString();

                // 1. Mutex Concurrency Lock: Reject immediate double-taps or parallel requests
                if (claimingPackageIds.has(pkgId)) {
                    return;
                }
                setClaimingPackageIds(prev => new Set(prev).add(pkgId));

                const targetPkg = activePackages.find(p => p.id === pkgId || p.$id === pkgId);
                if (!targetPkg) {
                    setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                    return;
                }

                // 2. Client-side Kampala Calendar Day Verification
                if ((targetPkg.lastclaimdate && new Date(new Date(targetPkg.lastclaimdate).getTime() + 3 * 60 * 60 * 1000).toISOString().slice(0, 10) === todayKampala) || (targetPkg.lastClaimDate && new Date(new Date(targetPkg.lastClaimDate).getTime() + 3 * 60 * 60 * 1000).toISOString().slice(0, 10) === todayKampala)) {
                    showToast("Today's reward has already been claimed. Your next reward will be available on the next eligible day.");
                    setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                    return;
                }

                if ((targetPkg.daysclaimed || 0) >= 25 || (targetPkg.daysClaimed || 0) >= 25) {
                    showToast("Package has completed all 25 days of rewards!");
                    setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                    return;
                }

                try {
                    // 3. Database Idempotency Check: Verify if claim already recorded in Appwrite today
                    const claimsCheck = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DAILYCLAIMS}/documents`);
                    if (claimsCheck.ok && claimsCheck.data && claimsCheck.data.documents) {
                        const alreadyClaimedDoc = claimsCheck.data.documents.find(d => 
                            (d.userId === (currentUser.$id || currentUser.phone)) &&
                            (d.userpackageId === (targetPkg.$id || String(targetPkg.id))) &&
                            (d.claimdate && d.claimdate.startsWith(todayKampala))
                        );
                        if (alreadyClaimedDoc) {
                            showToast("Today's reward has already been claimed. Your next reward will be available on the next eligible day.");
                            setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                            return;
                        }
                    }

                    const newDaysClaimed = (targetPkg.daysclaimed || targetPkg.daysClaimed || 0) + 1;
                    const isCompleted = newDaysClaimed >= 25;
                    const claimAmount = targetPkg.daily || targetPkg.dailyreturn;

                    // 4. Deterministic Unique Document ID enforcing database-level uniqueness
                    const userShort = (currentUser.$id || currentUser.phone).replace(/[^a-zA-Z0-9]/g, '').slice(-8);
                    const pkgShort = (targetPkg.$id || String(targetPkg.id)).replace(/[^a-zA-Z0-9]/g, '').slice(-8);
                    const dateClean = todayKampala.replace(/-/g, '');
                    const deterministicClaimId = `clm_${userShort}_${pkgShort}_${dateClean}`;

                    // Record in dailyclaims table
                    const claimPostRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DAILYCLAIMS}/documents`, 'POST', {
                        documentId: deterministicClaimId,
                        data: {
                            userId: currentUser.$id || currentUser.phone,
                            userpackageId: targetPkg.$id || String(targetPkg.id),
                            daynumber: newDaysClaimed,
                            claimdate: new Date().toISOString(),
                            amount: claimAmount,
                            status: 'claimed',
                            transactionId: 'claim_' + Date.now(),
                            claimedat: new Date().toISOString()
                        }
                    });

                    // If Appwrite returned 409 conflict, it means duplicate was blocked by database
                    if (!claimPostRes.ok && claimPostRes.status === 409) {
                        showToast("Today's reward has already been claimed. Your next reward will be available on the next eligible day.");
                        setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                        return;
                    }

                    // 5. Update userpackages record
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.USERPACKAGES}/documents/${targetPkg.$id || ''}`, 'PATCH', {
                        data: {
                            daysclaimed: newDaysClaimed,
                            nextclaimday: isCompleted ? 26 : newDaysClaimed + 1,
                            lastclaimdate: new Date(todayKampala + 'T00:00:00+03:00').toISOString(),
                            totalreturns: (targetPkg.totalreturns || 0) + claimAmount,
                            status: isCompleted ? 'completed' : 'active',
                            completiondate: isCompleted ? new Date().toISOString() : (targetPkg.completiondate || targetPkg.completionDate)
                        }
                    }).catch(() => {});

                    // 6. Credit Available Balance (Earnings)
                    const updatedAvail = availablebalance + claimAmount;
                    setAvailablebalance(updatedAvail);

                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${currentUser.$id || ''}`, 'PATCH', {
                        data: {
                            availablebalance: updatedAvail,
                            totaldailyrewards: (currentUser.totaldailyrewards || 0) + claimAmount
                        }
                    }).catch(() => {});

                    // 7. Update local packages list
                    const updatedPackages = activePackages.map(p => {
                        if (p.id === pkgId || p.$id === pkgId) {
                            return {
                                ...p,
                                daysClaimed: newDaysClaimed,
                                daysclaimed: newDaysClaimed,
                                lastClaimDate: todayKampala,
                                lastclaimdate: new Date(todayKampala + 'T00:00:00+03:00').toISOString(),
                                status: isCompleted ? 'completed' : 'active'
                            };
                        }
                        return p;
                    });

                    if (isCompleted) {
                        setActivePackages(updatedPackages.filter(p => p.status === 'active'));
                        setCompletedPackages(prev => [...prev, { ...targetPkg, daysclaimed: 25, status: 'completed' }]);
                    } else {
                        setActivePackages(updatedPackages);
                    }

                    // 8. Add ledger entry
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: {
                            userId: currentUser.$id || currentUser.phone,
                            transactiontype: 'daily_reward',
                            amount: claimAmount,
                            balancebefore: availablebalance,
                            balanceafter: updatedAvail,
                            refId: 'claim_' + Date.now(),
                            status: 'completed'
                        }
                    }).catch(() => {});

                    // 9. Notification
                    const timeNow = new Date().toISOString().replace('T', ' ').substring(0, 16);
                    setNotifications(prev => [
                        { id: Date.now(), title: "Daily Reward Claimed", body: `UGX ${claimAmount.toLocaleString()} added to your Earnings Balance for Day ${newDaysClaimed} of 25.`, time: timeNow, read: false },
                        ...prev
                    ]);
                    persistUserNotification("Daily Reward Claimed", `UGX ${claimAmount.toLocaleString()} added to your Earnings Balance for Day ${newDaysClaimed} of 25.`, 'daily_reward', deterministicClaimId);

                    showToast(`+UGX ${claimAmount.toLocaleString()} added to your Earnings Balance! 🇺🇬🎄`);
                } catch (err) {
                    showToast('Claim error: ' + err.message);
                    logDiagnosticError('claims', 'claimDaily', 'updateRecord', err.message);
                } finally {
                    setClaimingPackageIds(prev => { const n = new Set(prev); n.delete(pkgId); return n; });
                }
            };

            // ==================== UNBOX & COLLECT GIFTS ====================
            const startUnboxing = (gift) => {
                if (gift.collected) return;
                setSelectedGift(gift);
                setUnboxingStage('shaking');
            };

            const triggerUnboxingSteps = () => {
                if (unboxingStage === 'shaking') {
                    setUnboxingStage('untied');
                } else if (unboxingStage === 'untied') {
                    setUnboxingStage('opened');
                }
            };

            // A gift has one permanent collection key. The synchronous lock blocks rapid
            // repeat taps in this browser; the Appwrite status claim blocks later attempts.
            const collectGiftReward = async () => {
                const gift = selectedGift;
                if (giftCollecting || !gift || gift.collected || !currentUser || !gift.id) return;
                window.__sanyuGiftCollectLocks = window.__sanyuGiftCollectLocks || new Set();
                const lockKey = String(gift.id);
                if (window.__sanyuGiftCollectLocks.has(lockKey)) return;
                window.__sanyuGiftCollectLocks.add(lockKey);
                setGiftCollecting(true);
                const giftUrl = `/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.GIFTS}/documents/${encodeURIComponent(lockKey)}`;
                const ownerId = currentUser.$id || currentUser.phone;
                const amount = Number(gift.cash) || 0;
                const now = new Date().toISOString();
                try {
                    if (amount <= 0) throw new Error('This gift has no valid reward amount.');

                    // Read the authoritative record before attempting the one-time claim.
                    const currentGiftRes = await callAppwrite(giftUrl);
                    if (!currentGiftRes || !currentGiftRes.ok || !currentGiftRes.data) {
                        throw new Error('Could not verify this gift with the server. Please try again.');
                    }
                    const serverGift = currentGiftRes.data;
                    if (serverGift.status !== 'unlocked') {
                        setGifts(prev => prev.filter(g => String(g.id) !== lockKey));
                        setSelectedGift(null);
                        setUnboxingStage('closed');
                        return;
                    }

                    // Claim first. A repeat tap sees collecting/collected and cannot credit again.
                    const claimRes = await callAppwrite(giftUrl, 'PATCH', { data: { status: 'collecting', openedat: serverGift.openedat || now } });
                    if (!claimRes || !claimRes.ok) throw new Error((claimRes && claimRes.data && claimRes.data.message) || 'The gift could not be locked for collection.');
                    setGifts(prev => prev.map(g => String(g.id) === lockKey ? { ...g, collected: true, new: false } : g));

                    const before = Number(availablebalance) || 0;
                    const after = before + amount;
                    // Reserve the unique gift ledger key BEFORE changing the balance. A second
                    // tab/device receives 409 for this same key and must not credit the reward.
                    const ledgerId = `gift_${lockKey}`;
                    const ledgerRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: ledgerId,
                        data: { userId: ownerId, transactiontype: 'gift_reward', amount, balancebefore: before, balanceafter: after, refId: ledgerId, status: 'processing' }
                    });
                    if (!ledgerRes || !ledgerRes.ok) {
                        if (ledgerRes && ledgerRes.status === 409) {
                            setGifts(prev => prev.filter(g => String(g.id) !== lockKey));
                            setSelectedGift(null);
                            setUnboxingStage('closed');
                            return;
                        }
                        throw new Error((ledgerRes && ledgerRes.data && ledgerRes.data.message) || 'The one-time reward record could not be reserved.');
                    }

                    const profileRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${encodeURIComponent(currentUser.$id || '')}`, 'PATCH', {
                        data: { availablebalance: after, totalgiftrewards: (Number(currentUser.totalgiftrewards) || 0) + amount }
                    });
                    if (!profileRes || !profileRes.ok) throw new Error((profileRes && profileRes.data && profileRes.data.message) || 'The reward balance could not be updated.');
                    const ledgerFinishRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents/${encodeURIComponent(ledgerId)}`, 'PATCH', { data: { status: 'completed' } });
                    if (!ledgerFinishRes || !ledgerFinishRes.ok) throw new Error((ledgerFinishRes && ledgerFinishRes.data && ledgerFinishRes.data.message) || 'The reward ledger could not be finalized.');

                    const notificationId = `gift_notice_${lockKey}`;
                    const noticeText = `Collected ${gift.giftName} and UGX ${amount.toLocaleString()} cash to your Earnings Balance.`;
                    const noticeRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.NOTIFICATIONS}/documents`, 'POST', {
                        documentId: notificationId,
                        data: { userId: ownerId, title: 'Christmas Jersey Gift Collected', message: noticeText, type: 'gift_reward', referenceId: lockKey, isread: false, readAt: null }
                    });
                    if (!noticeRes || (!noticeRes.ok && noticeRes.status !== 409)) throw new Error((noticeRes && noticeRes.data && noticeRes.data.message) || 'The gift notification could not be saved.');

                    const finishRes = await callAppwrite(giftUrl, 'PATCH', { data: { status: 'collected', collectedat: now, openedat: serverGift.openedat || now } });
                    if (!finishRes || !finishRes.ok) throw new Error((finishRes && finishRes.data && finishRes.data.message) || 'The collection could not be finalized.');

                    setAvailablebalance(after);
                    setCurrentUser(prev => ({ ...prev, availablebalance: after, totalgiftrewards: (Number(prev.totalgiftrewards) || 0) + amount }));
                    setGifts(prev => prev.filter(g => String(g.id) !== lockKey));
                    const timeNow = now.replace('T', ' ').substring(0, 16);
                    setNotifications(prev => prev.some(n => String(n.id) === notificationId) ? prev : [{ id: notificationId, title: 'Christmas Jersey Gift Collected', body: noticeText, message: noticeText, time: timeNow, read: false }, ...prev]);
                    showToast(`🎁 Collected ${gift.giftName} & cash to Earnings Balance!`);
                    setSelectedGift(null);
                    setUnboxingStage('closed');
                } catch (err) {
                    // Keep the gift locked locally after the server claim to prevent accidental re-credit.
                    logDiagnosticError('gifts', 'collectGift', 'oneTimeCollection', err.message);
                    showToast('Gift collection could not be completed. Please contact support before trying again.');
                } finally {
                    window.__sanyuGiftCollectLocks.delete(lockKey);
                    setGiftCollecting(false);
                }
            };

            // ==================== DEPOSITS (CRITICAL FINANCIAL RULE) ====================
            // The customer frontend NEVER credits a wallet when a user submits a deposit!
            // 1. Frontend creates deposit record with status "pending".
            // 2. Display confirmation that request was submitted for review.
            // 3. Do not increase profiles.walletbalance.
            // 4. Do not create wallet-credit ledger entry.
            // 5. Do not display deposit as approved.
            // 6. Fetch actual wallet balance from Appwrite.
            const handleDepositSubmit = async (e) => {
                e.preventDefault();
                const amt = parseInt(depositAmount, 10);
                if (!amt || amt < 1000 || !txId.trim()) {
                    showToast("Please enter a valid amount (min UGX 1,000) and Transaction ID or Username.");
                    return;
                }

                setDepositSubmitting(true);
                try {
                    const depositRecord = {
                        userId: currentUser ? (currentUser.$id || currentUser.phone) : 'guest',
                        amount: amt,
                        payerphone: currentUser ? currentUser.phone : '+256700000000',
                        recipientId: network,
                        network: network,
                        transactionId: txId.trim(),
                        requestreference: 'dep_' + Date.now(),
                        status: 'pending', // MUST REMAIN PENDING UNTIL EXPLICIT ADMIN APPROVAL!
                        submittedat: new Date().toISOString(),
                        // Appwrite currently requires reviewedat. Use submission time as a schema-compatible placeholder; status remains pending and admin overwrites this on review.
                        reviewedat: new Date().toISOString(),
                        reviewedby: 'Pending'
                    };

                    const depRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DEPOSITS}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: depositRecord
                    });

                    if (!depRes.ok || !depRes.data?.$id) {
                        logDiagnosticError('deposits', 'submitDeposit', 'depositsTable', depRes.data?.message || 'Appwrite did not return a saved deposit row.', depRes.status, '/deposits');
                        throw new Error(depRes.data?.message || 'Your deposit request was not saved. Please try again after checking the details.');
                    }

                    // Only display a deposit after Appwrite confirms the real row was created.
                    const newDepItem = {
                        ...depositRecord,
                        $id: depRes.data.$id
                    };
                    setUserDeposits(prev => [newDepItem, ...prev]);

                    // Reset form fields
                    setDepositAmount('');
                    setTxId('');

                    // CRITICAL: WALLET BALANCE IS NOT TOUCHED!
                    // Show confirmation of review submission
                    showToast('Deposit Submitted');
                } catch (err) {
                    showToast('Deposit error: ' + err.message);
                    logDiagnosticError('deposits', 'submitDepositException', 'execute', err.message);
                } finally {
                    setDepositSubmitting(false);
                }
            };

            // ==================== ADMIN DEPOSIT REVIEW (IDEMPOTENT APPROVAL) ====================
            // Admin explicitly approves or rejects pending deposit.
            // Only after successful approval may the trusted admin operation credit profiles.walletbalance.
            // Prevents repeated approvals from crediting the same deposit twice!
            const handleAdminApproveDeposit = async (dep) => {
                if (dep.status === 'approved') {
                    showToast("⚠️ This deposit has already been approved and credited!");
                    return;
                }

                setApprovingDepositId(dep.$id);
                try {
                    // 1. Verify in Appwrite that deposit is still pending (idempotency check)
                    const checkRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DEPOSITS}/documents/${dep.$id}`);
                    if (checkRes.ok && checkRes.data && checkRes.data.status === 'approved') {
                        showToast("⚠️ Deposit was already approved previously.");
                        setApprovingDepositId(null);
                        return;
                    }

                    // 2. Mark deposit as approved
                    const updateDepRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DEPOSITS}/documents/${dep.$id}`, 'PATCH', {
                        data: {
                            status: 'approved',
                            reviewedat: new Date().toISOString(),
                            reviewedby: 'Admin'
                        }
                    });

                    // 3. Fetch latest profile of the deposit owner
                    const profRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${dep.userId}`);
                    let targetUser = profRes.ok && profRes.data ? profRes.data : currentUser;
                    const prevWallet = Number(targetUser.walletbalance) || 0;
                    const newWallet = prevWallet + dep.amount;

                    // 4. Credit profiles.walletbalance
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${targetUser.$id}`, 'PATCH', {
                        data: { walletbalance: newWallet }
                    });

                    // 5. Create wallet-credit ledger entry exactly once
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: {
                            userId: targetUser.$id,
                            transactiontype: 'deposit_credit',
                            amount: dep.amount,
                            balancebefore: prevWallet,
                            balanceafter: newWallet,
                            refId: dep.transactionId || dep.requestreference,
                            status: 'completed'
                        }
                    });

                    // Update local lists
                    setAllPendingDeposits(prev => prev.map(d => d.$id === dep.$id ? { ...d, status: 'approved' } : d));
                    setUserDeposits(prev => prev.map(d => d.$id === dep.$id ? { ...d, status: 'approved' } : d));
                    
                    if (currentUser && currentUser.$id === targetUser.$id) {
                        setWalletbalance(newWallet);
                    }

                    showToast(`✓ Deposit of UGX ${dep.amount.toLocaleString()} APPROVED and credited to Wallet!`);
                } catch (e) {
                    showToast('Approval error: ' + e.message);
                } finally {
                    setApprovingDepositId(null);
                }
            };

            const handleAdminRejectDeposit = async (dep) => {
                if (dep.status === 'rejected') return;
                setApprovingDepositId(dep.$id);
                try {
                    await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.DEPOSITS}/documents/${dep.$id}`, 'PATCH', {
                        data: {
                            status: 'rejected',
                            reviewedat: new Date().toISOString(),
                            reviewedby: 'Admin'
                        }
                    });
                    setAllPendingDeposits(prev => prev.map(d => d.$id === dep.$id ? { ...d, status: 'rejected' } : d));
                    setUserDeposits(prev => prev.map(d => d.$id === dep.$id ? { ...d, status: 'rejected' } : d));
                    showToast(`✕ Deposit of UGX ${dep.amount.toLocaleString()} rejected. No wallet credited.`);
                } catch (e) {
                    showToast('Reject error: ' + e.message);
                } finally {
                    setApprovingDepositId(null);
                }
            };

            // ==================== WITHDRAWALS ====================
            // Strictly deducts from availablebalance.
            const handleWithdrawSubmit = async (e) => {
                e.preventDefault();
                const amt = parseInt(withdrawAmount, 10);
                if (isNaN(amt) || amt < 5000) {
                    showToast("❌ Minimum withdrawal amount is UGX 5,000.");
                    return;
                }
                if (amt > availablebalance) {
                    showToast("❌ Insufficient Earnings Balance.");
                    return;
                }
                if (withdrawPhone.length !== 9) {
                    showToast("❌ Enter a valid 9-digit Ugandan phone number after +256-.");
                    return;
                }

                const tax = Math.round(amt * 0.10);
                const net = amt - tax;
                const balanceBefore = Number(availablebalance) || 0;
                const newBal = balanceBefore - amt;
                const userId = currentUser ? (currentUser.$id || currentUser.phone) : 'guest';

                try {
                    const withdrawDoc = {
                        userId,
                        amount: amt,
                        taxrateBps: 1000,
                        taxamount: tax,
                        netamount: net,
                        phonenumber: '+256' + withdrawPhone,
                        status: 'pending',
                        requestref: 'wdr_' + Date.now(),
                        requestedat: new Date().toISOString(),
                        reviewedat: null,
                        paidat: null
                    };

                    // First create the pending withdrawal request. Do not deduct on a failed create.
                    const wdrRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.WITHDRAWS}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: withdrawDoc
                    });
                    if (!wdrRes.ok) {
                        logDiagnosticError('withdraws', 'submitWithdraw', 'withdrawsTable', wdrRes.data?.message || 'Withdrawal request was not saved', wdrRes.status, '/withdraws');
                        throw new Error(wdrRes.data?.message || 'Withdrawal request could not be saved. Your balance has not been changed.');
                    }

                    // Deduct the full gross request amount from earnings and persist it in the profile.
                    const balanceRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.PROFILES}/documents/${currentUser.$id || ''}`, 'PATCH', {
                        data: {
                            availablebalance: newBal,
                            totalwithdraws: (currentUser.totalwithdraws || 0) + amt
                        }
                    });
                    if (!balanceRes.ok) {
                        logDiagnosticError('withdraws', 'persistWithdrawalDeduction', 'profilesTable', balanceRes.data?.message || 'Earnings balance update failed after withdrawal request was saved', balanceRes.status, '/profiles');
                        showToast('Withdrawal request is recorded as pending, but the earnings balance update needs admin attention. Do not submit it again.');
                        return;
                    }

                    setAvailablebalance(newBal);
                    setCurrentUser(prev => ({ ...prev, availablebalance: newBal, totalwithdraws: (prev.totalwithdraws || 0) + amt }));
                    setWithdrawAmount('');

                    // Ledger entry mirrors the gross deduction. A ledger failure is logged; it does not restore funds.
                    const ledgerRes = await callAppwrite(`/databases/${APPWRITE_CONFIG.DATABASE_ID}/collections/${APPWRITE_CONFIG.TABLES.LEDGER}/documents`, 'POST', {
                        documentId: generateUniqueId(),
                        data: {
                            userId,
                            transactiontype: 'withdrawal_request',
                            amount: amt,
                            balancebefore: balanceBefore,
                            balanceafter: newBal,
                            refId: withdrawDoc.requestref,
                            status: 'pending'
                        }
                    });
                    if (!ledgerRes.ok) {
                        logDiagnosticError('withdraws', 'writeWithdrawalLedger', 'ledgerTable', ledgerRes.data?.message || 'Ledger write failed', ledgerRes.status, '/ledger');
                    }

                    const timeNow = new Date().toISOString().replace('T', ' ').substring(0, 16);
                    setNotifications(prev => [
                        { id: Date.now(), title: "Withdrawal Requested", body: `UGX ${amt.toLocaleString()} requested to +256${withdrawPhone}. Net: UGX ${net.toLocaleString()} after 10% tax.`, time: timeNow, read: false },
                        ...prev
                    ]);

                    showToast('Withdrawal Submitted, waiting for review');
                    setScreen('home');
                } catch (err) {
                    showToast('Withdrawal error: ' + err.message);
                    logDiagnosticError('withdraws', 'submitWithdrawException', 'execute', err.message);
                }
            };

                        // Filter payment recipients for selected network
            const matchingRecipients = paymentRecipients.filter(r => 
                (r.network || '').toLowerCase().includes(network.toLowerCase())
            );

            return (
                <div className="min-h-screen bg-stone-950 text-stone-100 flex flex-col">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-stone-900 border-2 border-yellow-400 text-yellow-300 font-bold px-4 py-3 rounded-2xl shadow-2xl text-xs flex items-center space-x-2 animate-bounce max-w-[90vw]">
                            <span>🔔</span>
                            <span>{toast}</span>
                        </div>
                    )}

                    {/* Ugandan Celebration Atmospheric Header */}
                    <div className="w-full ug-flag-header pt-4 pb-5 px-4 shadow-xl">
                        {/* High Visibility Ugandan Group Celebration Background Image */}
                        <div 
                            className="absolute inset-0 bg-cover bg-center opacity-45 pointer-events-none"
                            style={{ backgroundImage: `url('${EMBEDDED_ASSETS.hero_uganda_group}')` }}
                        ></div>
                        <div className="absolute inset-0 bg-gradient-to-r from-black/85 via-black/60 to-black/85 pointer-events-none"></div>

                        <div className="relative max-w-md mx-auto flex justify-between items-center">
                            <div className="flex items-center space-x-2.5">
                                <span className="text-3xl filter drop-shadow-md">🇺🇬</span>
                                <div>
                                    <h1 className="text-xl font-black text-yellow-400 tracking-wider flex items-center gap-1.5">
                                        <span>SANYU SEASON</span>
                                        <span className="text-xs bg-red-600 text-white px-1.5 py-0.2 rounded font-black">2026</span>
                                    </h1>
                                    <p className="text-[11px] text-stone-200 font-medium">Pearl of Africa Christmas Rewards</p>
                                </div>
                            </div>
                            
                            {screen !== 'auth' && (
                                <div className="flex items-center space-x-2">
                                    <button onClick={markNotificationsAsRead} className="relative p-2 bg-black/70 rounded-full text-yellow-400 hover:bg-black/90 transition border border-yellow-500/40">
                                        <span className="text-base">🔔</span>
                                        {unreadNotifsCount > 0 && (
                                            <span className="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white text-[9px] font-black rounded-full flex items-center justify-center animate-pulse">
                                                {unreadNotifsCount}
                                            </span>
                                        )}
                                    </button>
                                    <button onClick={handleLogout} className="px-3 py-1.5 bg-red-950/90 text-red-200 border border-red-700/60 text-xs font-black rounded-xl hover:bg-red-900 transition">
                                        Logout
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="max-w-md mx-auto px-4 mt-2 w-full flex-1">
                        {/* ==================== AUTH SCREEN ==================== */}
                        {screen === 'auth' && (
                            <div className="bg-stone-900 border border-stone-800 rounded-3xl p-6 shadow-2xl mt-4">
                                <div className="text-center mb-6">
                                    <div className="inline-block p-4 bg-red-950/70 rounded-full border-2 border-yellow-400 text-3xl mb-2 animate-float">
                                        🎅🏿🇺🇬
                                    </div>
                                    <h2 className="text-2xl font-black text-yellow-400">SANYU SEASON 2026</h2>
                                    <p className="text-sm text-stone-300 mt-1">
                                        {authMode === 'login' ? 'Kilikitya, welcome back to Sanyu!' : 'Kilikitya, create your festive account!'}
                                    </p>
                                </div>

                                {authError && (
                                    <div className="bg-red-950/70 border border-red-600 text-red-200 text-xs p-3.5 rounded-xl mb-4 font-semibold leading-relaxed">
                                        {authError}
                                    </div>
                                )}

                                <form onSubmit={authMode === 'login' ? handleLogin : handleRegister} className="space-y-4">
                                    {authMode === 'register' && (
                                        <div>
                                            <label className="text-xs font-bold text-stone-300 block mb-1">Username</label>
                                            <input 
                                                type="text" 
                                                value={username} 
                                                onChange={e => setUsername(e.target.value)} 
                                                placeholder="e.g. Robert Kyagulanyi Ssentamu" 
                                                className="w-full bg-stone-950 border border-stone-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-yellow-400" 
                                                required 
                                            />
                                        </div>
                                    )}
                                    <div>
                                        <label className="text-xs font-bold text-stone-300 block mb-1">Ugandan Phone Number</label>
                                        <div className="flex items-center rounded-xl overflow-hidden border border-stone-700 focus-within:border-yellow-400 bg-stone-950">
                                            <div className="flex items-center space-x-1.5 bg-stone-900 px-3 py-3 text-sm font-black text-yellow-400 border-r border-stone-700 select-none shrink-0">
                                                <span>🇺🇬 +256-</span>
                                            </div>
                                            <input 
                                                type="tel" 
                                                value={phone} 
                                                onChange={e => handlePhoneInput(e.target.value, setPhone)}
