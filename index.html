                                    <span className={hasUncollectedGifts ? 'animate-bounce' : ''}>📦</span>
                                </div>
                                <span className={`text-[10px] font-black mt-1 ${screen === 'gifts' ? 'text-yellow-400' : 'text-stone-400'}`}>Gifts</span>
                            </button>

                            <button onClick={() => setScreen('referral')} className="flex flex-col items-center group cursor-pointer">
                                <div className={`w-10 h-10 rounded-full flex items-center justify-center text-lg transition ${screen === 'referral' ? 'santa-icon-badge text-white scale-110' : 'bg-stone-900 text-stone-300 border border-stone-800'}`}>
                                    ⭐
                                </div>
                                <span className={`text-[10px] font-black mt-1 ${screen === 'referral' ? 'text-yellow-400' : 'text-stone-400'}`}>Invite</span>
                            </button>
                        </div>
                    )}
                
                    {/* Fixed Diagnostics & Download Buttons */}
                    <div className="fixed bottom-20 right-3 z-50 flex flex-col space-y-1.5 items-end">
                        <button 
                            onClick={() => {
                                const blob = new Blob([document.documentElement.outerHTML], { type: 'text/html;charset=utf-8' });
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = 'index.html';
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                            }} 
                            className="px-2.5 py-1.5 bg-yellow-500 hover:bg-yellow-400 text-stone-950 text-[10px] font-black rounded-lg shadow-xl flex items-center space-x-1 transition cursor-pointer"
                        >
                            <span>📥</span>
                            <span>Download index.html</span>
                        </button>
                        <button 
                            onClick={triggerDiagnostic} 
                            className="px-2.5 py-1.5 bg-stone-900/90 text-stone-400 hover:text-yellow-400 text-[10px] font-bold rounded-lg border border-stone-800 shadow-lg backdrop-blur flex items-center space-x-1 transition cursor-pointer"
                        >
                            <span>🛠️</span>
                            <span>Diagnostics & Admin</span>
                        </button>
                    </div>

                    {/* Diagnostic & Admin Review Modal */}
                    {showDiagModal && (
                        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-stone-900 border border-stone-700 rounded-3xl max-w-lg w-full p-5 shadow-2xl text-left space-y-3 max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center border-b border-stone-800 pb-2">
                                    <h3 className="text-sm font-black text-yellow-400 flex items-center space-x-1.5">
                                        <span>🛠️ System Diagnostic & Admin Review</span>
                                    </h3>
                                    <button onClick={() => setShowDiagModal(false)} className="text-stone-400 hover:text-white text-xs cursor-pointer">✕ Close</button>
                                </div>

                                <div className="text-[11px] text-stone-300 space-y-1 bg-stone-950 p-2.5 rounded-xl border border-stone-800">
                                    <p><strong>Appwrite Project ID:</strong> {APPWRITE_CONFIG.PROJECT_ID}</p>
                                    <p><strong>Database ID:</strong> {APPWRITE_CONFIG.DATABASE_ID}</p>
                                    <p><strong>User:</strong> {currentUser ? `${currentUser.username} (${currentUser.phone})` : 'Guest'}</p>
                                    <p><strong>Wallet Balance (Purchases):</strong> UGX {walletbalance.toLocaleString()}</p>
                                    <p><strong>Earnings Balance (Withdraw):</strong> UGX {availablebalance.toLocaleString()}</p>
                                </div>

                                {/* Admin Deposit Review Tool for Live Testing & Verification */}
                                <div className="bg-stone-950 p-3 rounded-xl border border-yellow-500/30 space-y-2">
                                    <div className="flex justify-between items-center">
                                        <h4 className="text-xs font-black text-yellow-400">👑 Admin Deposit Review & Approval</h4>
                                        <span className="text-[10px] text-stone-400">Idempotent (No Double Credits)</span>
                                    </div>
                                    <p className="text-[10px] text-stone-400 leading-snug">
                                        Per financial rules, customer submissions remain pending. Admins review and explicitly approve to credit the Deposit Wallet.
                                    </p>

                                    <div className="max-h-36 overflow-y-auto space-y-1.5 pr-1">
                                        {allPendingDeposits.length === 0 ? (
                                            <p className="text-[10px] text-stone-500 italic">No deposit records found in Appwrite.</p>
                                        ) : (
                                            allPendingDeposits.map(dep => (
                                                <div key={dep.$id} className="p-2 bg-stone-900 rounded-lg border border-stone-800 flex justify-between items-center text-[10px]">
                                                    <div>
                                                        <span className="font-bold text-white">UGX {dep.amount?.toLocaleString()}</span>
                                                        <span className="text-stone-400 ml-1">({dep.network} - {dep.payerphone})</span>
                                                        <p className="text-stone-500 font-mono truncate max-w-[150px]">{dep.transactionId}</p>
                                                    </div>
                                                    <div className="flex items-center space-x-1.5">
                                                        {dep.status === 'approved' ? (
                                                            <span className="text-green-400 font-bold">✓ Approved</span>
                                                        ) : dep.status === 'rejected' ? (
                                                            <span className="text-red-400 font-bold">✕ Rejected</span>
                                                        ) : (
                                                            <>
                                                                <button 
                                                                    onClick={() => handleAdminApproveDeposit(dep)}
                                                                    disabled={approvingDepositId === dep.$id}
                                                                    className="px-2 py-1 bg-green-600 hover:bg-green-500 text-white font-black rounded cursor-pointer"
                                                                >
                                                                    {approvingDepositId === dep.$id ? '...' : 'Approve'}
                                                                </button>
                                                                <button 
                                                                    onClick={() => handleAdminRejectDeposit(dep)}
                                                                    disabled={approvingDepositId === dep.$id}
                                                                    className="px-2 py-1 bg-red-700 hover:bg-red-600 text-white font-bold rounded cursor-pointer"
                                                                >
                                                                    Reject
                                                                </button>
                                                            </>
                                                        )}
                                                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>

                                <div className="flex-1 overflow-y-auto space-y-2 pr-1 font-mono text-[10px]">
                                    {diagnosticLogs.length === 0 ? (
                                        <div className="p-3 text-center text-stone-500">
                                            No runtime errors recorded yet. All operations working smoothly!
                                        </div>
                                    ) : (
                                        diagnosticLogs.map(log => (
                                            <div key={log.id} className="p-2.5 bg-stone-950 border border-red-900/50 rounded-lg text-stone-300 space-y-0.5">
                                                <div className="flex justify-between text-yellow-400 font-bold">
                                                    <span>[{log.category.toUpperCase()}] {log.action}</span>
                                                    <span>HTTP {log.httpStatus}</span>
                                                </div>
                                                <p className="text-red-400">Step: {log.failedStep} — {log.errorMessage}</p>
                                                <p className="text-stone-500 text-[9px]">{log.timestamp} | {log.requestPath}</p>
                                                {log.details && <p className="text-stone-400 text-[9px] truncate">{log.details}</p>}
                                            </div>
                                        ))
                                    )}
                                </div>
                                <div className="flex space-x-2 pt-2 border-t border-stone-800">
                                    <button onClick={copyDiagnosticReport} className="flex-1 py-2 bg-yellow-500 hover:bg-yellow-400 text-stone-950 font-black text-xs rounded-xl shadow transition cursor-pointer">
                                        {diagCopied ? '✓ Copied Report to Clipboard!' : 'Copy Diagnostic Report'}
                                    </button>
                                    <button onClick={() => setShowDiagModal(false)} className="px-4 py-2 bg-stone-800 hover:bg-stone-700 text-stone-200 text-xs font-bold rounded-xl cursor-pointer">
                                        Close
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>


</body></html>
